<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chovy MARK - v4.5 Center Scroll · Skip · Progress</title>
    <style>
        :root {
            --bg-color: #080c16;
            --panel-bg: #10182a;
            --panel-deep: #0d1423;
            --card-bg: #17223a;
            --card-hover: #1b2945;
            --border-color: #293957;
            --border-soft: rgba(148, 163, 184, 0.12);

            --text-main: #f4f7fb;
            --text-muted: #93a4bd;
            --text-dim: #65758f;

            --primary: #6366f1;
            --primary-hover: #7c7ff5;
            --primary-deep: #4f46e5;
            --accent: #38bdf8;
            --accent-soft: rgba(56, 189, 248, 0.11);

            --danger: #f43f5e;
            --danger-soft: rgba(244, 63, 94, 0.10);

            --success: #34d399;
            --success-soft: rgba(52, 211, 153, 0.12);

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.20);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.28);
            --shadow-primary: 0 7px 24px rgba(99, 102, 241, 0.26);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100vw;
        }

        button, label {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font-family: inherit;
        }

        /* =========================================================
           Q-BOUNCE INTERACTION SYSTEM
           ========================================================= */

        .q-btn {
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition:
                transform 90ms cubic-bezier(0.2, 0.8, 0.2, 1),
                background-color 140ms ease,
                border-color 140ms ease,
                color 140ms ease,
                box-shadow 140ms ease,
                opacity 140ms ease;
        }

        .q-btn:hover {
            transform: translateY(-1px);
        }

        .q-btn:active {
            transform: translateY(1px) scale(0.97) !important;
        }

        .q-btn:focus-visible {
            outline: 2px solid rgba(99, 102, 241, 0.65);
            outline-offset: 2px;
        }

        .q-primary:hover {
            transform: translateY(-2px) scale(1.015);
        }

        .q-primary:active {
            transform: translateY(1px) scale(0.95) !important;
        }

        .q-icon:hover {
            transform: scale(1.07);
        }

        .q-icon:active {
            transform: scale(0.91) !important;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        header {
            min-height: 56px;
            padding: 10px 14px;
            background:
                linear-gradient(180deg, rgba(19, 29, 50, 0.98), rgba(16, 24, 42, 0.98));
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 10;
        }

        header h1 {
            font-size: 0.94rem;
            font-weight: 650;
            display: flex;
            align-items: center;
            gap: 7px;
            letter-spacing: -0.01em;
        }

        header h1::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.75);
        }

        header h1 span {
            font-size: 0.62rem;
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.28);
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
        }

        .file-controls {
            display: flex;
            gap: 7px;
            font-size: 0.78rem;
        }

        .file-controls label {
            background: rgba(23, 34, 58, 0.9);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            min-height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 550;
            box-shadow: var(--shadow-sm);
        }

        .file-controls label svg {
            width: 15px;
            height: 15px;
            fill: var(--accent);
            flex-shrink: 0;
            transition: transform 140ms ease;
        }

        .file-controls label:hover {
            background: var(--card-hover);
            border-color: rgba(56, 189, 248, 0.45);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
        }

        .file-controls label:hover svg {
            transform: scale(1.12);
        }

        .file-controls input[type="file"] {
            display: none;
        }

        /* =========================================================
           MAIN LAYOUT / VIDEO
           ========================================================= */

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        @media (min-width: 768px) {
            .main-container {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 420px;
            }
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            background: #060912;
            border-bottom: 1px solid var(--border-color);
            min-width: 0;
        }

        @media (min-width: 768px) {
            .left-panel {
                border-bottom: none;
                border-right: 1px solid var(--border-color);
            }
        }

        .video-container {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        video {
            width: 100%;
            max-height: 35vh;
            outline: none;
            display: block;
        }

        .player-bar {
            padding: 11px 14px 13px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .time-display {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.82rem;
            color: var(--accent);
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }

        /* =========================================================
           BUTTONS & TOGGLES
           ========================================================= */

        .btn {
            background: var(--primary);
            color: #fff;
            border: 1px solid transparent;
            padding: 9px 15px;
            border-radius: 8px;
            font-weight: 550;
            font-size: 0.84rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.16);
        }

        .btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 5px 14px rgba(99, 102, 241, 0.20);
        }

        .btn-mark {
            min-height: 43px;
            background: linear-gradient(135deg, #696cf2 0%, #514de1 100%);
            box-shadow: var(--shadow-primary);
            font-weight: 700;
            letter-spacing: 0.025em;
            position: relative;
            overflow: hidden;
        }

        .btn-mark::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                110deg,
                transparent 20%,
                rgba(255,255,255,0.09) 45%,
                transparent 70%
            );
            transform: translateX(-100%);
            transition: transform 400ms ease;
        }

        .btn-mark:hover::after {
            transform: translateX(100%);
        }

        .btn-mark:hover {
            background: linear-gradient(135deg, #777af5 0%, #5a55ea 100%);
            box-shadow: 0 9px 28px rgba(99, 102, 241, 0.36);
        }

        .btn-danger {
            background: var(--danger-soft);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.20);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
            box-shadow: 0 5px 16px rgba(244, 63, 94, 0.22);
        }

        .btn-flat {
            background: #182238;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 11px;
            border-radius: 7px;
            font-size: 0.77rem;
            font-weight: 550;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-flat:hover {
            background: var(--card-hover);
            border-color: #405174;
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--card-hover);
            border-color: #405174;
        }

        .btn-accent {
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.20);
        }

        .btn-accent:hover {
            background: rgba(56, 189, 248, 0.18);
            color: #7dd3fc;
            border-color: rgba(56, 189, 248, 0.42);
            box-shadow: 0 5px 16px rgba(56, 189, 248, 0.12);
        }

        .btn-sm {
            min-height: 31px;
            padding: 6px 10px;
            font-size: 0.73rem;
            border-radius: 7px;
        }

        .btn-mastered {
            background: var(--success-soft);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .btn-mastered:hover {
            background: rgba(52, 211, 153, 0.22);
            border-color: rgba(52, 211, 153, 0.5);
        }

        .btn-mastered.is-mastered {
            background: rgba(52, 211, 153, 0.28);
            color: #6ee7b7;
            border-color: rgba(52, 211, 153, 0.55);
        }

        .playlist-toggle-btn {
            background: #182238;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 11px;
            border-radius: 7px;
            font-size: 0.77rem;
            font-weight: 550;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 140ms ease;
        }

        .playlist-toggle-btn.active {
            background: rgba(52, 211, 153, 0.15);
            color: var(--success);
            border-color: rgba(52, 211, 153, 0.45);
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.2);
        }

        /* =========================================================
           RIGHT PANEL / TABS & SWIPE CONTAINER
           ========================================================= */

        .right-panel {
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
            overflow: hidden;
            flex: 1;
            position: relative;
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: var(--panel-deep);
            flex-shrink: 0;
            padding: 3px 5px 0;
            gap: 2px;
            z-index: 2;
        }

        .tab-btn {
            flex: 1;
            position: relative;
            padding: 10px 8px 9px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 550;
            text-align: center;
            border-radius: 7px 7px 0 0;
            font-size: 0.79rem;
        }

        .tab-btn::after {
            content: "";
            position: absolute;
            left: 25%;
            right: 25%;
            bottom: 0;
            height: 2px;
            border-radius: 2px 2px 0 0;
            background: transparent;
            transform: scaleX(0.4);
            transition: transform 140ms ease, background-color 140ms ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.025);
        }

        .tab-btn.active {
            color: #f8fafc;
            background: rgba(99, 102, 241, 0.07);
        }

        .tab-btn.active::after {
            background: var(--primary);
            transform: scaleX(1);
            box-shadow: 0 0 9px rgba(99, 102, 241, 0.45);
        }

        .swipe-track {
            display: flex;
            width: 200%;
            flex: 1;
            height: 0;
            will-change: transform;
        }

        .tab-content {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            padding: 12px;
            position: relative;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #334462 transparent;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .tab-content::-webkit-scrollbar {
            width: 5px;
        }

        .tab-content::-webkit-scrollbar-thumb {
            background: #334462;
            border-radius: 99px;
        }

        /* =========================================================
           SUBTITLES
           ========================================================= */

        .subtitle-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .sub-item {
            padding: 11px 12px;
            border-radius: 9px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            font-size: 0.84rem;
            line-height: 1.42;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        .sub-item:hover {
            background: var(--card-hover);
            border-color: #405174;
        }

        .sub-item.current {
            background: linear-gradient(
                135deg,
                rgba(59, 130, 246, 0.19),
                rgba(30, 64, 175, 0.10)
            );
            border-color: rgba(59, 130, 246, 0.72);
            box-shadow:
                0 5px 16px rgba(59, 130, 246, 0.16),
                inset 3px 0 0 #60a5fa;
        }

        .sub-time {
            font-family: ui-monospace, monospace;
            font-size: 0.68rem;
            color: var(--accent);
            margin-bottom: 4px;
            font-variant-numeric: tabular-nums;
        }

        .sub-item.current .sub-time {
            color: #93c5fd;
        }

        /* =========================================================
           MARK CARDS
           ========================================================= */

        .mark-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .mark-card {
            background: linear-gradient(145deg, #18253f, #152039);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 11px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.12);
            position: relative;
            overflow: hidden;
            transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
        }

        .mark-card:hover {
            background: linear-gradient(145deg, #1b2a47, #17233e);
            border-color: rgba(99, 102, 241, 0.60);
            box-shadow: 0 6px 18px rgba(0,0,0,0.20);
        }

        /* Active playlist highlight */
        .mark-card.active-playlist {
            background: linear-gradient(145deg, #14352f, #102722);
            border-color: rgba(52, 211, 153, 0.85);
            box-shadow: 0 5px 18px rgba(52, 211, 153, 0.28);
        }

        /* Mastered / skipped state */
        .mark-card.is-mastered {
            opacity: 0.55;
            background: linear-gradient(145deg, #1a2233, #151c2b);
            border-color: rgba(52, 211, 153, 0.25);
        }

        .mark-card.is-mastered .mark-text {
            text-decoration: line-through;
            color: var(--text-dim);
        }

        .mark-card.is-mastered.active-playlist {
            opacity: 0.75;
        }

        .mark-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 0.71rem;
            color: var(--text-muted);
            font-family: ui-monospace, monospace;
            font-variant-numeric: tabular-nums;
        }

        .mark-header .mark-time-icon {
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .mark-card.active-playlist .mark-time-icon {
            color: var(--success);
        }

        /* Pulsing live indicator */
        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            display: none;
            box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
            animation: livePulse 1.4s ease-out infinite;
        }

        .mark-card.active-playlist .live-dot {
            display: inline-block;
        }

        @keyframes livePulse {
            0%   { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
            70%  { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        .mastered-badge {
            font-size: 0.62rem;
            background: rgba(52, 211, 153, 0.18);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.35);
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .mark-text {
            font-size: 0.84rem;
            line-height: 1.42;
            color: #e8edf5;
        }

        .mark-actions {
            display: flex;
            gap: 6px;
            margin-top: 1px;
            flex-wrap: wrap;
        }

        .mark-actions .play-mark-btn {
            flex: 1;
            min-width: 70px;
        }

        /* Progress bar at bottom of active card */
        .mark-progress-track {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: rgba(52, 211, 153, 0.15);
            border-radius: 0 0 10px 10px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 160ms ease;
        }

        .mark-card.active-playlist .mark-progress-track {
            opacity: 1;
        }

        .mark-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #34d399, #6ee7b7);
            border-radius: 0 0 10px 10px;
            transition: width 80ms linear;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.45);
        }

        .top-import-container {
            margin-bottom: 10px;
        }

        .export-actions {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding-top: 11px;
            border-top: 1px solid var(--border-color);
        }

        .export-row {
            display: flex;
            gap: 7px;
        }

        .export-row button {
            flex: 1;
        }

        /* =========================================================
           FLOAT NAV
           ========================================================= */

        .float-nav-container {
            position: absolute;
            right: 14px;
            bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transform: translateY(9px);
            transition:
                opacity 200ms ease,
                transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1),
                visibility 200ms ease;
            pointer-events: none;
        }

        .float-nav-container.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }

        .float-btn {
            background: rgba(16, 24, 42, 0.90);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            width: 39px;
            height: 39px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.36);
            font-size: 0.9rem;
            outline: none;
        }

        .float-btn:hover {
            background: #17223a;
            color: var(--accent);
            border-color: rgba(56, 189, 248, 0.42);
            box-shadow: 0 7px 20px rgba(56, 189, 248, 0.13);
        }

        .float-btn:active {
            transform: scale(0.91) !important;
            background: rgba(56, 189, 248, 0.14);
            color: var(--accent);
            border-color: var(--accent);
        }

        /* =========================================================
           UNIFIED MODAL SYSTEM
           ========================================================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.76);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 12px;
        }

        .modal-overlay.active {
            display: flex;
            animation: modalFadeIn 140ms ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background: var(--panel-bg);
            border: 1px solid #344565;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow:
                0 24px 60px rgba(0,0,0,0.55),
                0 0 0 1px rgba(99, 102, 241, 0.05);
            animation: modalPop 160ms cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            padding: 13px 15px;
            background: var(--panel-deep);
            border-bottom: 1px solid var(--border-color);
            font-weight: 650;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border: 1px solid transparent;
            border-radius: 7px;
            background: transparent;
            color: var(--text-muted);
            font-size: 1.25rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: var(--text-main);
            background: rgba(148, 163, 184, 0.09);
            border-color: var(--border-color);
        }

        .modal-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 11px;
            font-size: 0.84rem;
        }

        .modal-footer {
            padding: 11px 15px;
            background: var(--panel-deep);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .candidate-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: background-color 140ms ease, border-color 140ms ease;
        }

        .candidate-item:hover {
            background: var(--card-hover);
            border-color: #3a4c6c;
        }

        .candidate-item input[type="checkbox"] {
            margin-top: 3px;
            transform: scale(1.18);
            cursor: pointer;
            accent-color: var(--primary);
        }

        .adjust-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 11px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .adjust-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 0.79rem;
            color: var(--text-muted);
        }

        .adjust-buttons {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: space-between;
        }

        .adjust-buttons .adjust-label {
            min-width: 36px;
            font-size: 0.73rem;
            color: var(--text-dim);
        }

        .adjust-buttons button {
            flex: 1;
        }

        textarea {
            background: #080d18;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.84rem;
            line-height: 1.45;
            outline: none;
            resize: none;
            font-family: inherit;
            transition: border-color 140ms ease, box-shadow 140ms ease;
        }

        textarea:focus {
            border-color: rgba(99, 102, 241, 0.75);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.10);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 34px;
            font-size: 0.82rem;
            padding: 20px;
            border: 1px dashed var(--border-color);
            border-radius: 10px;
            background: rgba(23, 34, 58, 0.30);
        }

        @media (max-width: 767px) {
            header { padding: 9px 11px; }
            header h1 { font-size: 0.88rem; }
            .file-controls label { padding: 5px 8px; min-height: 32px; }
            .file-controls label span { display: none; }
            .file-controls { gap: 5px; }
            video { max-height: 30vh; }
            .player-bar { padding: 9px 11px 11px; }
            .btn-mark { min-height: 45px; }
            .tab-content { padding: 10px; }
            .adjust-buttons { gap: 4px; }
            .adjust-buttons button { padding-left: 5px; padding-right: 5px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Chovy <span>v4.5</span></h1>
        <div class="file-controls">
            <label class="q-btn">
                <svg viewBox="0 0 24 24"><path d="M21 6.5l-4 4V7c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-3.5l4 4v-11zM15 17H5V7h10v10z"/></svg>
                Video
                <input type="file" id="videoFileInput" accept="video/*">
            </label>
            <label class="q-btn">
                <svg viewBox="0 0 24 24"><path d="M19 4H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V8h10v2z"/></svg>
                Subtitle
                <input type="file" id="subFileInput" accept=".srt,.vtt">
            </label>
        </div>
    </header>

    <div class="main-container">
        <div class="left-panel">
            <div class="video-container">
                <video id="videoPlayer" crossorigin="anonymous" playsinline controls>Your browser does not support video playback</video>
            </div>
            <div class="player-bar">
                <div class="player-row">
                    <span class="time-display" id="timeDisplay">00:00.000 / 00:00.000</span>
                    <div style="display: flex; gap: 6px;">
                        <button class="btn-flat q-btn" onclick="skipTime(-5)">↺ 5s</button>
                        <button class="btn-flat q-btn" onclick="skipTime(5)">5s ↻</button>
                    </div>
                </div>
                <div class="player-row">
                    <button class="playlist-toggle-btn q-btn" id="playlistToggleBtn" onclick="togglePlaylistMode()">
                        <span id="playlistIcon">🎧</span> Playlist Loop: <strong id="playlistStatusText">OFF</strong>
                    </button>
                    <button class="btn-flat q-btn" onclick="jumpToNextPlaylistMark()" title="Next Mark">⏭ Next</button>
                </div>
                <div class="player-row">
                    <button class="btn btn-mark q-btn" id="markBtn" style="width: 100%;">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
                        MARK (Fine-tune Clip)
                    </button>
                </div>
            </div>
        </div>

        <div class="right-panel" id="rightPanel">
            <div class="panel-tabs">
                <button class="tab-btn q-btn active" onclick="switchTab('subtitles')">Subtitles</button>
                <button class="tab-btn q-btn" onclick="switchTab('marks')">Mistakes (<span id="markCount">0</span>)</button>
            </div>

            <div class="swipe-track" id="swipeTrack">
                <div id="subtitlesTab" class="tab-content">
                    <div class="subtitle-list" id="subtitleList"></div>
                </div>

                <div id="marksTab" class="tab-content">
                    <div class="top-import-container">
                        <button class="btn btn-sm btn-secondary q-btn" onclick="openImportModal()" style="width: 100%;">
                            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/><path d="M10.5 12H7v2h3.5v3l4.5-4-4.5-4v3z"/></svg>
                            Import & Merge Backup (Text)
                        </button>
                    </div>

                    <div class="mark-list" id="markList"></div>
                    
                    <div class="export-actions" id="exportActions" style="display:none;">
                        <div class="export-row">
                            <button class="btn btn-sm btn-accent q-btn" onclick="openTextExportModal('JSON Backup', getJsonBackupContent())" style="width:100%;">
                                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3zM8 13h2.55v3h2.9v-3H16l-4-4-4 4z"/></svg>
                                Export Backup (JSON)
                            </button>
                        </div>
                        <div class="export-row">
                            <button class="btn btn-sm btn-danger q-btn" onclick="clearMarks()" style="width:100%;">
                                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                                Clear All Marks
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="float-nav-container" id="floatNav">
                <button class="float-btn q-btn q-icon" onclick="scrollToPosition('top')" title="回到顶部" aria-label="回到顶部">↑</button>
                <button class="float-btn q-btn q-icon" onclick="scrollToPosition('bottom')" title="划至底部" aria-label="划至底部">↓</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="globalModal">
        <div class="modal-box">
            <div class="modal-header">
                <span id="modalTitle">Modal Title</span>
                <button class="modal-close q-btn q-icon" onclick="closeModal()" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body" id="modalBodyContent"></div>
            <div class="modal-footer" id="modalFooterContent"></div>
        </div>
    </div>

    <script>
        const defaultSubtitles = [
            { id: 1, start: 2.15, end: 5.45, text: "All right, let's look at this matchup. Syndra versus Tristana." },
            { id: 2, start: 5.80, end: 8.90, text: "Tristana has very high explosive burst early on, especially with her bombs." },
            { id: 3, start: 9.20, end: 12.50, text: "So you cannot just walk up and trade auto-attacks carelessly." },
            { id: 4, start: 13.00, end: 16.80, text: "You need to space her properly using your Q range to poke safely." },
            { id: 5, start: 17.20, end: 20.40, text: "Watch how Syndra controls the wave here, keeping it slightly on her side." },
            { id: 6, start: 20.90, end: 24.30, text: "This prevents Tristana from freely jumping in without getting ganked." },
            { id: 7, start: 24.80, end: 28.10, text: "Very clean spacing and wave management. Keep an eye on this transition." }
        ];

        let subtitles = [...defaultSubtitles];
        let marks = [];

        try {
            const savedMarks = localStorage.getItem('chovy_mark_records');
            if (savedMarks) {
                marks = JSON.parse(savedMarks);
                // Migrate old marks: ensure mastered flag exists
                marks.forEach(m => {
                    if (typeof m.mastered === 'undefined') m.mastered = false;
                });
            }
        } catch (e) { console.error("Failed to load local archive", e); }

        let currentSubIndex = -1;
        let tempCandidates = [];
        let currentAdjustStart = 0;
        let currentAdjustEnd = 0;
        let previewTimer = null;
        let editingMarkId = null;
        let currentTabName = 'subtitles';
        let isPlaylistMode = false;
        let activePlaylistMarkId = null; // currently highlighted mark in loop

        // Web Audio API fade control
        let audioCtx = null;
        let sourceNode = null;
        let gainNode = null;
        let isAudioApiInited = false;

        const videoPlayer = document.getElementById('videoPlayer');
        const timeDisplay = document.getElementById('timeDisplay');
        const subtitleListEl = document.getElementById('subtitleList');
        const markListEl = document.getElementById('markList');
        const markCountEl = document.getElementById('markCount');
        const exportActionsEl = document.getElementById('exportActions');
        const marksTabEl = document.getElementById('marksTab');
        const floatNavEl = document.getElementById('floatNav');
        const rightPanelEl = document.getElementById('rightPanel');
        const swipeTrackEl = document.getElementById('swipeTrack');

        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;
        let currentTranslateX = 0;

        function initAudioContext() {
            if (isAudioApiInited) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                audioCtx = new AudioContext();
                gainNode = audioCtx.createGain();
                sourceNode = audioCtx.createMediaElementSource(videoPlayer);
                sourceNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                isAudioApiInited = true;
            } catch (e) {
                console.warn("Web Audio API init bypassed due to browser policy:", e);
            }
        }

        // Smooth fade jump
        function smoothJumpTo(targetTime) {
            if (!audioCtx || !gainNode || !isAudioApiInited) {
                videoPlayer.currentTime = targetTime;
                return;
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            gainNode.gain.cancelScheduledValues(now);
            gainNode.gain.setValueAtTime(gainNode.gain.value || 1, now);
            gainNode.gain.linearRampToValueAtTime(0.001, now + 0.05);

            setTimeout(() => {
                videoPlayer.currentTime = targetTime;
                const later = audioCtx.currentTime;
                gainNode.gain.cancelScheduledValues(later);
                gainNode.gain.setValueAtTime(0.001, later);
                gainNode.gain.linearRampToValueAtTime(1.0, later + 0.08);
            }, 55);
        }

        function updateTrackPosition(animate = false) {
            swipeTrackEl.style.transition = animate ? 'transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1)' : 'none';
            currentTranslateX = currentTabName === 'subtitles' ? 0 : -50;
            swipeTrackEl.style.transform = `translateX(${currentTranslateX}%)`;
        }

        rightPanelEl.addEventListener('touchstart', (e) => {
            if (e.target.closest('.modal-overlay')) return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            isSwiping = false;
            swipeTrackEl.style.transition = 'none';
        }, { passive: true });

        rightPanelEl.addEventListener('touchmove', (e) => {
            if (e.target.closest('.modal-overlay')) return;
            const currentX = e.changedTouches[0].screenX;
            const currentY = e.changedTouches[0].screenY;
            const diffX = currentX - touchStartX;
            const diffY = currentY - touchStartY;

            if (!isSwiping && Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 10) {
                isSwiping = true;
            }

            if (isSwiping) {
                const panelWidth = rightPanelEl.clientWidth;
                if (panelWidth > 0) {
                    const basePercent = currentTabName === 'subtitles' ? 0 : -50;
                    const deltaPercent = (diffX / panelWidth) * 50;
                    let targetPercent = basePercent + deltaPercent;
                    if (targetPercent > 0) targetPercent = targetPercent * 0.2;
                    if (targetPercent < -50) targetPercent = -50 + (targetPercent + 50) * 0.2;
                    swipeTrackEl.style.transform = `translateX(${targetPercent}%)`;
                }
            }
        }, { passive: true });

        rightPanelEl.addEventListener('touchend', (e) => {
            if (!isSwiping) return;
            isSwiping = false;
            const touchEndX = e.changedTouches[0].screenX;
            const diffX = touchEndX - touchStartX;
            const panelWidth = rightPanelEl.clientWidth;

            if (Math.abs(diffX) > panelWidth * 0.2) {
                if (diffX < 0 && currentTabName === 'subtitles') {
                    switchTab('marks', true);
                } else if (diffX > 0 && currentTabName === 'marks') {
                    switchTab('subtitles', true);
                } else {
                    updateTrackPosition(true);
                }
            } else {
                updateTrackPosition(true);
            }
        }, { passive: true });

        function switchTab(tabName, animated = false) {
            currentTabName = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'subtitles') {
                document.querySelector('.panel-tabs button:nth-child(1)').classList.add('active');
                floatNavEl.classList.remove('show');
            } else {
                document.querySelector('.panel-tabs button:nth-child(2)').classList.add('active');
            }
            updateTrackPosition(animated);
        }

        let scrollTimeout = null;
        marksTabEl.addEventListener('scroll', () => {
            if (currentTabName === 'marks' && marks.length > 3) {
                floatNavEl.classList.add('show');
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => { floatNavEl.classList.remove('show'); }, 2500);
            }
        });

        function scrollToPosition(pos) {
            document.activeElement.blur();
            if (pos === 'top') {
                marksTabEl.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                marksTabEl.scrollTo({ top: marksTabEl.scrollHeight, behavior: 'smooth' });
            }
        }

        function saveToLocalStorage() {
            try { localStorage.setItem('chovy_mark_records', JSON.stringify(marks)); }
            catch (e) { console.error("Failed to save local archive", e); }
        }

        function skipTime(seconds) {
            if (!videoPlayer.duration) return;
            let newTime = videoPlayer.currentTime + seconds;
            videoPlayer.currentTime = Math.max(0, Math.min(newTime, videoPlayer.duration));
        }

        /** Active (non-mastered) marks sorted by start time */
        function getActiveMarks() {
            return marks
                .filter(m => !m.mastered)
                .sort((a, b) => a.start - b.start);
        }

        function togglePlaylistMode() {
            initAudioContext();
            isPlaylistMode = !isPlaylistMode;
            const btn = document.getElementById('playlistToggleBtn');
            const statusText = document.getElementById('playlistStatusText');
            
            if (isPlaylistMode) {
                btn.classList.add('active');
                statusText.innerText = 'ON';
                const active = getActiveMarks();
                if (active.length === 0) {
                    alert('提示：当前没有可用的 MARK（全部已掌握或列表为空），串烧连播将无法生效。请先添加至少一个未掌握的 MARK！');
                    isPlaylistMode = false;
                    btn.classList.remove('active');
                    statusText.innerText = 'OFF';
                } else {
                    smoothJumpTo(active[0].start);
                    videoPlayer.play();
                }
            } else {
                btn.classList.remove('active');
                statusText.innerText = 'OFF';
                activePlaylistMarkId = null;
                clearActivePlaylistHighlight();
            }
            updateMarksUI();
        }

        function jumpToNextPlaylistMark() {
            initAudioContext();
            const active = getActiveMarks();
            if (active.length === 0) return;
            const currentTime = videoPlayer.currentTime;
            
            let nextMark = active.find(m => m.start > currentTime + 0.15);
            if (!nextMark) {
                nextMark = active[0];
            }
            smoothJumpTo(nextMark.start);
            videoPlayer.play();
        }

        // Playlist time update: highlight + auto-jump when past end, skip mastered
        function handlePlaylistTimeUpdate(currentTime) {
            if (!isPlaylistMode) return;

            const active = getActiveMarks();
            if (active.length === 0) {
                isPlaylistMode = false;
                document.getElementById('playlistToggleBtn').classList.remove('active');
                document.getElementById('playlistStatusText').innerText = 'OFF';
                clearActivePlaylistHighlight();
                return;
            }

            let currentMark = active.find(m => currentTime >= m.start && currentTime <= m.end);

            if (currentMark) {
                highlightActiveMarkCard(currentMark.id);
                updateMarkProgress(currentMark, currentTime);
            } else {
                // Past end of current or in gap → jump to next
                let nextMark = active.find(m => m.start > currentTime);
                if (!nextMark) {
                    nextMark = active[0];
                }
                smoothJumpTo(nextMark.start);
            }
        }

        function clearActivePlaylistHighlight() {
            const cards = markListEl.getElementsByClassName('mark-card');
            for (let card of cards) {
                card.classList.remove('active-playlist');
                const fill = card.querySelector('.mark-progress-fill');
                if (fill) fill.style.width = '0%';
            }
            activePlaylistMarkId = null;
        }

        function highlightActiveMarkCard(markId) {
            const cards = markListEl.getElementsByClassName('mark-card');
            let targetCard = null;

            for (let card of cards) {
                if (parseInt(card.dataset.markId) === markId) {
                    card.classList.add('active-playlist');
                    targetCard = card;
                } else {
                    card.classList.remove('active-playlist');
                    const fill = card.querySelector('.mark-progress-fill');
                    if (fill) fill.style.width = '0%';
                }
            }

            // Scroll into center when the active mark changes
            if (targetCard && activePlaylistMarkId !== markId) {
                activePlaylistMarkId = markId;
                // Only auto-scroll if marks tab is visible
                if (currentTabName === 'marks') {
                    targetCard.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center',
                        inline: 'nearest'
                    });
                }
            } else if (targetCard) {
                activePlaylistMarkId = markId;
            }
        }

        function updateMarkProgress(mark, currentTime) {
            const card = markListEl.querySelector('.mark-card[data-mark-id="' + mark.id + '"]');
            if (!card) return;
            const fill = card.querySelector('.mark-progress-fill');
            if (!fill) return;
            const duration = Math.max(0.01, mark.end - mark.start);
            const progress = Math.min(1, Math.max(0, (currentTime - mark.start) / duration));
            fill.style.width = (progress * 100).toFixed(1) + '%';
        }

        function renderSubtitles() {
            subtitleListEl.innerHTML = '';
            subtitles.forEach((sub, index) => {
                const item = document.createElement('div');
                item.className = 'sub-item q-btn';
                item.dataset.index = index;
                item.innerHTML = `
                    <div class="sub-time">${formatTime(sub.start)} - ${formatTime(sub.end)}</div>
                    <div>${sub.text}</div>
                `;
                item.onclick = () => {
                    initAudioContext();
                    videoPlayer.currentTime = sub.start;
                    videoPlayer.play();
                };
                subtitleListEl.appendChild(item);
            });
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = (seconds % 60).toFixed(2);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        videoPlayer.addEventListener('timeupdate', () => {
            initAudioContext();
            const currentTime = videoPlayer.currentTime;
            const duration = videoPlayer.duration || 0;
            timeDisplay.innerText = formatTime(currentTime) + ' / ' + formatTime(duration);

            // Subtitle highlight always runs
            let activeIndex = subtitles.findIndex(sub => currentTime >= sub.start && currentTime <= sub.end);
            if (activeIndex === -1) {
                activeIndex = subtitles.findIndex((sub, idx) => {
                    const nextSub = subtitles[idx + 1];
                    return currentTime >= sub.start && (!nextSub || currentTime < nextSub.start);
                });
            }

            if (activeIndex !== -1 && activeIndex !== currentSubIndex) {
                currentSubIndex = activeIndex;
                updateSubtitleHighlight(currentSubIndex);
            }

            if (isPlaylistMode) {
                handlePlaylistTimeUpdate(currentTime);
                return;
            }

            if (previewTimer && currentTime >= currentAdjustEnd) {
                videoPlayer.pause();
                previewTimer = null;
            }
        });

        function updateSubtitleHighlight(index) {
            const items = subtitleListEl.getElementsByClassName('sub-item');
            for (let i = 0; i < items.length; i++) {
                if (i === index) {
                    items[i].classList.add('current');
                    const container = document.getElementById('subtitlesTab');
                    const targetItem = items[i];
                    container.scrollTo({
                        top: targetItem.offsetTop - container.offsetTop - (container.clientHeight / 2) + (targetItem.clientHeight / 2),
                        behavior: 'smooth'
                    });
                } else {
                    items[i].classList.remove('current');
                }
            }
        }

        function showModal(title, bodyHtml, footerHtml) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBodyContent').innerHTML = bodyHtml;
            document.getElementById('modalFooterContent').innerHTML = footerHtml;
            document.getElementById('globalModal').classList.add('active');
        }

        function closeModal() {
            videoPlayer.pause();
            previewTimer = null;
            document.getElementById('globalModal').classList.remove('active');
        }

        document.getElementById('markBtn').addEventListener('click', () => {
            initAudioContext();
            videoPlayer.pause(); 
            editingMarkId = null; 

            const currentTime = videoPlayer.currentTime;
            const windowBefore = 3.0, windowAfter = 3.0;

            tempCandidates = subtitles.filter(sub => 
                sub.end >= (currentTime - windowBefore) && sub.start <= (currentTime + windowAfter)
            );

            if (tempCandidates.length === 0) {
                tempCandidates = [{ start: Math.max(0, currentTime - 2), end: currentTime + 2, text: '[Custom Node @ ' + formatTime(currentTime) + ']' }];
            }

            renderFineTuneModalContent();
        });

        function renderFineTuneModalContent() {
            let candidatesHtml = '';
            if (editingMarkId === null) {
                candidatesHtml = `
                    <div style="font-size: 0.8rem; color: var(--text-muted);">1. Select sentences to keep:</div>
                    <div id="candidateList" style="display: flex; flex-direction: column; gap: 6px;">
                        ${tempCandidates.map((sub, idx) => `
                            <div class="candidate-item">
                                <input type="checkbox" id="cand_${idx}" checked onchange="updateModalTimeAndPreview()">
                                <label for="cand_${idx}" style="cursor:pointer; flex:1;">
                                    <div style="font-family: monospace; font-size: 0.75rem; color: var(--accent);">${formatTime(sub.start)} -${formatTime(sub.end)}</div>
                                    <div>${sub.text}</div>
                                </label>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            const bodyHtml = `
                ${candidatesHtml}
                <div class="adjust-panel">
                    <div class="adjust-row">
                        <span>Range Adjust (Current: <strong id="previewTimeRange" style="color:var(--accent);">0:00 - 0:00</strong>)</span>
                        <button class="btn btn-sm btn-accent q-btn" onclick="previewCurrentMark()">▶ Live Preview</button>
                    </div>
                    <div class="adjust-buttons">
                        <span class="adjust-label">Start</span>
                        <button class="btn btn-sm btn-secondary q-btn" onclick="adjustTimeOffset('start', -1)">-1s</button>
                        <button class="btn btn-sm btn-secondary q-btn" onclick="adjustTimeOffset('start', -0.5)">-0.5s</button>
                        <button class="btn btn-sm btn-secondary q-btn" onclick="adjustTimeOffset('start', 0.5)">+0.5s</button>
                        <button class="btn btn-sm btn-secondary q-btn" onclick="adjustTimeOffset('start', 1)">+1s</button>
                    </div>
                    <div class="adjust-buttons">
                        <span class="adjust-label">End</span>
                        <button class="btn btn-sm btn-secondary q-btn" onclick="adjustTimeOffset('end', -1)">-1s</button>
                        <button class="btn btn-sm btn-secondary q-btn" onclick="adjustTimeOffset('end', -0.5)">-0.5s</button>
                        <button class="btn btn-sm btn-secondary q-btn" onclick="adjustTimeOffset('end', 0.5)">+0.5s</button>
                        <button class="btn btn-sm btn-secondary q-btn" onclick="adjustTimeOffset('end', 1)">+1s</button>
                    </div>
                </div>
                <div>
                    <label style="font-size: 0.8rem; color: var(--text-muted);">Merged Text Fine-tuning:</label>
                    <textarea id="modalTextPreview" style="width: 100%; height: 60px; margin-top: 4px;"></textarea>
                </div>
            `;

            const footerHtml = `
                <button class="btn btn-sm btn-secondary q-btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-sm q-btn" onclick="confirmSaveMark()">💾 Save</button>
            `;

            showModal(editingMarkId !== null ? 'Edit MARK / Re-adjust Range' : '✏️ Fine-tune MARK Range', bodyHtml, footerHtml);
            updateModalTimeAndPreview();
        }

        function updateModalTimeAndPreview() {
            if (editingMarkId === null) {
                let checkedSubs = [];
                tempCandidates.forEach((sub, idx) => {
                    const cb = document.getElementById('cand_' + idx);
                    if (cb && cb.checked) { checkedSubs.push(sub); }
                });

                if (checkedSubs.length > 0) {
                    currentAdjustStart = checkedSubs[0].start;
                    currentAdjustEnd = checkedSubs[checkedSubs.length - 1].end;
                } else {
                    currentAdjustStart = videoPlayer.currentTime;
                    currentAdjustEnd = videoPlayer.currentTime + 3;
                }
            }

            validateAndClampTimes();
            
            const timeRangeEl = document.getElementById('previewTimeRange');
            if (timeRangeEl) { timeRangeEl.innerText = formatTime(currentAdjustStart) + ' - ' + formatTime(currentAdjustEnd); }
            
            const textPreviewEl = document.getElementById('modalTextPreview');
            if (textPreviewEl && editingMarkId === null) {
                let selectedTexts = [];
                tempCandidates.forEach((sub, idx) => {
                    const cb = document.getElementById('cand_' + idx);
                    if (cb && cb.checked) { selectedTexts.push(sub.text); }
                });
                textPreviewEl.value = selectedTexts.join(' ');
            }
        }

        function adjustTimeOffset(target, delta) {
            if (target === 'start') { currentAdjustStart += delta; }
            else { currentAdjustEnd += delta; }
            validateAndClampTimes();
            const timeRangeEl = document.getElementById('previewTimeRange');
            if (timeRangeEl) { timeRangeEl.innerText = formatTime(currentAdjustStart) + ' - ' + formatTime(currentAdjustEnd); }
        }

        function validateAndClampTimes() {
            const duration = videoPlayer.duration && !isNaN(videoPlayer.duration) ? videoPlayer.duration : Infinity;
            if (currentAdjustStart < 0) currentAdjustStart = 0;
            if (currentAdjustStart >= duration) currentAdjustStart = Math.max(0, duration - 0.1);
            if (currentAdjustEnd <= currentAdjustStart) currentAdjustEnd = currentAdjustStart + 0.1;
            if (currentAdjustEnd > duration) currentAdjustEnd = duration;
        }

        function previewCurrentMark() {
            videoPlayer.currentTime = currentAdjustStart;
            videoPlayer.play();
            previewTimer = true;
        }

        function confirmSaveMark() {
            videoPlayer.pause();
            previewTimer = null;
            validateAndClampTimes();
            const finalText = document.getElementById('modalTextPreview').value.trim() || "[Empty Text]";

            if (editingMarkId !== null) {
                let mark = marks.find(m => m.id === editingMarkId);
                if (mark) {
                    mark.start = currentAdjustStart;
                    mark.end = currentAdjustEnd;
                    mark.text = finalText;
                    mark.timestampStr = formatTime(currentAdjustStart) + ' - ' + formatTime(currentAdjustEnd);
                }
            } else {
                marks.unshift({
                    id: Date.now(),
                    start: currentAdjustStart,
                    end: currentAdjustEnd,
                    text: finalText,
                    timestampStr: formatTime(currentAdjustStart) + ' - ' + formatTime(currentAdjustEnd),
                    mastered: false
                });
            }

            marks.sort((a, b) => a.start - b.start);
            saveToLocalStorage();
            closeModal();
            updateMarksUI();
        }

        function editMark(id, event) {
            if (event) event.stopPropagation();
            const mark = marks.find(m => m.id === id);
            if (!mark) return;

            videoPlayer.pause();
            editingMarkId = id;
            currentAdjustStart = mark.start;
            currentAdjustEnd = mark.end;

            renderFineTuneModalContent();
            document.getElementById('modalTextPreview').value = mark.text;
        }

        /** Card click handler: playlist ON → jump; OFF → edit */
        function onMarkCardClick(id, event) {
            // Ignore clicks that originated from action buttons
            if (event.target.closest('.mark-actions')) return;

            if (isPlaylistMode) {
                initAudioContext();
                const mark = marks.find(m => m.id === id);
                if (!mark) return;
                // Even if mastered, allow manual jump when user explicitly clicks
                smoothJumpTo(mark.start);
                videoPlayer.play();
            } else {
                editMark(id, event);
            }
        }

        function toggleMastered(id, event) {
            if (event) event.stopPropagation();
            const mark = marks.find(m => m.id === id);
            if (!mark) return;
            mark.mastered = !mark.mastered;
            saveToLocalStorage();
            updateMarksUI();

            // If we just mastered the currently playing mark, jump to next
            if (isPlaylistMode && mark.mastered && activePlaylistMarkId === id) {
                jumpToNextPlaylistMark();
            }
        }

        function getJsonBackupContent() { return JSON.stringify(marks, null, 2); }

        function openTextExportModal(titleType, textContent) {
            const bodyHtml = '<textarea style="width:100%;height:180px;font-family:monospace;" id="exportTextarea" readonly>' + textContent + '</textarea>';
            const footerHtml = '<button class="btn btn-sm q-btn" style="width:100%;" onclick="copyModalText()">Copy All Content</button>';
            showModal('📋 Export ' + titleType + ' (Sorted)', bodyHtml, footerHtml);
        }

        function copyModalText() {
            const textarea = document.getElementById('exportTextarea');
            if (textarea) {
                textarea.select();
                document.execCommand('copy');
                alert('Copied to clipboard!');
            }
        }

        function openImportModal() {
            const bodyHtml = '<textarea id="importJsonTextArea" style="width:100%;height:180px;font-family:monospace;" placeholder="Paste JSON here..."></textarea>';
            const footerHtml = '<button id="confirmImportBtn" class="btn btn-sm q-btn" style="width:100%;" onclick="confirmImportBackup()">Confirm Merge Import</button>';
            showModal('📂 Import & Merge Backup (Paste JSON)', bodyHtml, footerHtml);
        }

        function confirmImportBackup() {
            const text = document.getElementById('importJsonTextArea').value.trim();
            if (!text) { alert('Please paste the JSON content first!'); return; }
            try {
                const imported = JSON.parse(text);
                if (Array.isArray(imported)) {
                    const existingMap = new Map();
                    marks.forEach(m => existingMap.set(m.id || (m.start + '-' + m.end), m));
                    let addedCount = 0;
                    imported.forEach(m => {
                        const key = m.id || (m.start + '-' + m.end);
                        if (!existingMap.has(key)) {
                            if (typeof m.mastered === 'undefined') m.mastered = false;
                            existingMap.set(key, m);
                            addedCount++;
                        }
                    });
                    marks = Array.from(existingMap.values());
                    marks.sort((a, b) => a.start - b.start);
                    saveToLocalStorage();
                    updateMarksUI();
                    closeModal();
                    alert('Successfully merged! Added ' + addedCount + ' new marks. Total now: ' + marks.length + ' marks.');
                } else { alert("Invalid archive file format!"); }
            } catch (err) { alert("Failed to parse JSON. Please ensure the format is correct."); }
        }

        function updateMarksUI() {
            markCountEl.innerText = marks.length;
            markListEl.innerHTML = '';
            if (marks.length === 0) {
                markListEl.innerHTML = '<div class="empty-state">No marks yet<br><span style="color:var(--text-dim);font-size:0.74rem;">Hit MARK while watching to build your list.</span></div>';
                exportActionsEl.style.display = 'none';
                floatNavEl.classList.remove('show');
                return;
            }
            exportActionsEl.style.display = 'flex';
            marks.sort((a, b) => a.start - b.start);

            marks.forEach(mark => {
                const card = document.createElement('div');
                card.className = 'mark-card q-btn' + (mark.mastered ? ' is-mastered' : '');
                card.dataset.markId = mark.id;
                card.onclick = (e) => onMarkCardClick(mark.id, e);

                const masteredBadge = mark.mastered
                    ? '<span class="mastered-badge">✓ Mastered</span>'
                    : '';

                const tipText = isPlaylistMode
                    ? 'Tap to jump & play'
                    : 'Tap card to edit';

                card.innerHTML = `
                    <div class="mark-header">
                        <span>
                            <span class="mark-time-icon">
                                <span class="live-dot"></span>
                                ●
                            </span>
                            ${mark.timestampStr}
                        </span>
                        <span style="display:flex;align-items:center;gap:6px;">
                            ${masteredBadge}
                            <span style="color:var(--text-dim);font-size:0.68rem;">${tipText}</span>
                        </span>
                    </div>
                    <div class="mark-text">${mark.text}</div>
                    <div class="mark-actions">
                        <button class="btn btn-sm btn-secondary q-btn play-mark-btn" onclick="event.stopPropagation(); initAudioContext(); smoothJumpTo(${mark.start});videoPlayer.play();">
                            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Play
                        </button>
                        <button class="btn btn-sm btn-mastered q-btn ${mark.mastered ? 'is-mastered' : ''}" onclick="toggleMastered(${mark.id}, event)" title="${mark.mastered ? 'Unmark as mastered' : 'Mark as mastered / Skip'}">
                            ${mark.mastered ? '↺ Undo' : '✓ Mastered'}
                        </button>
                        <button class="btn btn-sm btn-danger q-btn q-icon" aria-label="Delete mark" title="Delete" onclick="event.stopPropagation(); deleteMark(${mark.id})">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                    <div class="mark-progress-track">
                        <div class="mark-progress-fill"></div>
                    </div>
                `;
                markListEl.appendChild(card);
            });

            // Re-apply active highlight if playlist is running
            if (isPlaylistMode && activePlaylistMarkId) {
                highlightActiveMarkCard(activePlaylistMarkId);
            }
        }

        function deleteMark(id) {
            // Secondary confirmation to prevent accidental deletes
            if (!confirm('确定要删除这条 MARK 吗？\nDelete this mark permanently?')) {
                return;
            }
            marks = marks.filter(m => m.id !== id);
            if (activePlaylistMarkId === id) {
                activePlaylistMarkId = null;
            }
            saveToLocalStorage();
            updateMarksUI();
        }

        function clearMarks() {
            if (confirm("Are you sure you want to clear all marks?")) { 
                marks = []; 
                activePlaylistMarkId = null;
                saveToLocalStorage();
                updateMarksUI(); 
            }
        }

        document.getElementById('videoFileInput').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                videoPlayer.src = URL.createObjectURL(e.target.files[0]);
                initAudioContext();
            }
        });

        document.getElementById('subFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    subtitles = parseSubtitleFile(event.target.result, file.name);
                    renderSubtitles();
                    alert('Subtitles loaded successfully, total ' + subtitles.length + ' entries');
                };
                reader.readAsText(file);
            }
        });

        function parseSubtitleFile(content, filename) {
            const isVtt = filename.endsWith('.vtt');
            const lines = content.replace(/\r\n/g, '\n').split('\n');
            let parsed = [];
            let i = 0;
            function parseTimeToSeconds(timeStr) {
                timeStr = timeStr.trim();
                const cleanTime = timeStr.split(' ')[0];
                const parts = cleanTime.split(':');
                let hours = 0, minutes = 0, seconds = 0;
                if (parts.length === 3) {
                    hours = parseFloat(parts[0]) || 0;
                    minutes = parseFloat(parts[1]) || 0;
                    seconds = parseFloat(parts[2].replace(',', '.')) || 0;
                } else if (parts.length === 2) {
                    minutes = parseFloat(parts[0]) || 0;
                    seconds = parseFloat(parts[1].replace(',', '.')) || 0;
                }
                return hours * 3600 + minutes * 60 + seconds;
            }
            while (i < lines.length) {
                let line = lines[i].trim();
                if (isVtt && line === 'WEBVTT') { i++; continue; }
                if (line.includes('-->')) {
                    const timeParts = line.split('-->');
                    const start = parseTimeToSeconds(timeParts[0]);
                    const end = parseTimeToSeconds(timeParts[1]);
                    i++;
                    let textLines = [];
                    while (i < lines.length && lines[i].trim() !== '') {
                        textLines.push(lines[i].trim());
                        i++;
                    }
                    if (textLines.length > 0) {
                        parsed.push({ start, end, text: textLines.join(' ') });
                    }
                } else { i++; }
            }
            return parsed.length > 0 ? parsed : defaultSubtitles;
        }

        renderSubtitles();
        updateMarksUI();
        updateTrackPosition(false);
    </script>
</body>
</html>
